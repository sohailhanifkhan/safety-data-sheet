<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSDS HSE Library</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #eef2f7;
}

.header {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: white;
    padding: 20px;
    text-align: center;
}

.stats {
    display: flex;
    justify-content: space-around;
    background: white;
    padding: 10px;
}

.search, .filter {
    text-align: center;
    margin: 10px;
}

.search input {
    width: 90%;
    max-width: 500px;
    padding: 12px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

select {
    padding: 10px;
    border-radius: 5px;
}

.container {
    max-width: 750px;
    margin: auto;
    padding: 10px;
}

.card {
    background: white;
    padding: 10px;
    margin: 8px 0;
    border-radius: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    color: white;
    cursor: pointer;
}

/* Category colors */
.flammable { background: #e74c3c; }
.oil { background: #f39c12; }
.chemical { background: #3498db; }
.paint { background: #9b59b6; }
.sealant { background: #16a085; }

.footer {
    text-align: center;
    font-size: 12px;
    padding: 10px;
    color: gray;
}
</style>
</head>

<body>

<div class="header">
    <h2>MSDS HSE Library</h2>
    <p>Scan & Access Safety Data Sheets</p>
</div>

<div class="stats">
    <div>
        <h3 id="total">0</h3>
        <p>Total Chemicals</p>
    </div>
    <div>
        <h3 id="available">0</h3>
        <p>MSDS Available</p>
    </div>
</div>

<div class="search">
    <input type="text" id="search" placeholder="Search Chemical..." onkeyup="applyFilters()">
</div>

<div class="filter">
    <select id="categoryFilter" onchange="applyFilters()">
        <option value="All">All Categories</option>
        <option value="Flammable">Flammable</option>
        <option value="Oil">Oil</option>
        <option value="Chemical">Chemical</option>
        <option value="Paint">Paint</option>
        <option value="Sealant">Sealant</option>
    </select>
</div>

<div class="container" id="list"></div>

<div class="footer">
    HSE Department | Sohail Hanif
</div>

<script>
/* 🔴 PASTE YOUR PUBLISHED CSV LINK HERE */
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSSksGapM9TAjh1gbpm6JxtidPcA9XD2gwT40anhDJCfSys4xqlNKTAZIBnuxVBzgpNZWyvMvhAWjrA/pub?gid=0&single=true&output=csv";

let dataList = [];

/* ✅ LOAD DATA FROM GOOGLE SHEET */
fetch(sheetURL)
.then(res => res.text())
.then(csv => {
    const rows = csv.split("\n").slice(1);

    rows.forEach(row => {
        if (!row.trim()) return;

        // ✅ Safe CSV parsing (handles commas)
        const cols = row.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
        if (!cols || cols.length < 2) return;

        const name = cols[0].replace(/"/g, "").trim();
        let url = cols[1].replace(/"/g, "").trim();
        const category = cols[2] ? cols[2].replace(/"/g, "").trim() : "Chemical";

        // ✅ Force Google Drive to open freely
        if (url.includes("drive.google.com")) {
            url = url.replace("/view", "/preview");
        }

        dataList.push({ name, url, category });
    });

    updateStats();
    render(dataList);
});

/* ✅ DISPLAY LIST */
function render(list) {
    const container = document.getElementById("list");
    container.innerHTML = "";

    list.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";

        const btn = document.createElement("button");
        btn.className = item.category.toLowerCase();
        btn.textContent = `${item.name} (${item.category})`;

        btn.onclick = () => {
            if (item.url && item.url.startsWith("http")) {
                window.open(item.url, "_blank");
            } else {
                alert("MSDS not available");
            }
        };

        card.appendChild(btn);
        container.appendChild(card);
    });
}

/* ✅ SEARCH + FILTER */
function applyFilters() {
    const text = document.getElementById("search").value.toLowerCase();
    const cat = document.getElementById("categoryFilter").value;

    const filtered = dataList.filter(item => {
        const nameMatch = item.name.toLowerCase().includes(text);
        const catMatch = cat === "All" || item.category === cat;
        return nameMatch && catMatch;
    });

    render(filtered);
}

/* ✅ STATS */
function updateStats() {
    document.getElementById("total").innerText = dataList.length;
    document.getElementById("available").innerText =
        dataList.filter(i => i.url).length;
}
</script>

</body>
</html>
